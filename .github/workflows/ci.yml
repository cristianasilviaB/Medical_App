name: FastAPI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Alembic Migrations & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medical_user
          POSTGRES_PASSWORD: medical_password
          POSTGRES_DB: hospital_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "req.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r req.txt

      - name: Run Alembic database migrations
        env:
          SQLALCHEMY_DATABASE_URL: postgresql://medical_user:medical_password@localhost:5432/hospital_db
        run: |
          alembic upgrade head

      - name: Run Pytest suite with coverage
        env:
          SQLALCHEMY_DATABASE_URL: postgresql://medical_user:medical_password@localhost:5432/hospital_db
          TEST_DATABASE_URL: postgresql://medical_user:medical_password@localhost:5432/hospital_test_db
        run: |
          python -m pytest --cov=router --cov=services --cov=repositories --cov-report=term-missing

  docker-build:
    name: Build Docker Image (CD Check)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: medical-app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max